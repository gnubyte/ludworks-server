name: update-ludworks-server

# Installs the latest release (v0.1.1) .deb of ludworks on the deploy-01 host.
# The job container cannot nsenter (options ignored by the runner), so a
# helper container gets the job's workspace volume at /w plus host root at
# /host and /run (systemd sockets).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ludworks-update
  cancel-in-progress: false

jobs:
  update:
    name: dpkg install 0.1.1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v3

      - name: Verify deb
        run: |
          set -euo pipefail
          test -f ludworks_0.1.1_amd64.deb
          echo "df1291884f85a1bee58fdc7e94bc61ff4adb878278d40cecd6f93b5a6d892f9a  ludworks_0.1.1_amd64.deb" | sha256sum -c -

      - name: Install on host via helper container
        run: |
          set -euo pipefail
          CID=$(hostname)
          SRC=$(docker inspect -f '{{range .Mounts}}{{if .Destination}}{{.Destination}}={{.Source}}
          {{end}}{{end}}' "$CID" | grep 'ludworks-server=' | head -1 | cut -d= -f2)
          echo "host volume: $SRC"
          test -n "$SRC"
          # helper visible in job at /workspace/..., on host at $SRC/...
          cat > /workspace/OWNER/ludworks-server/helper.sh <<'EOF'
          set -eu
          H=/host
          test -f /w/ludworks_0.1.1_amd64.deb
          [ -f "$H/etc/ludworks/config.json" ] && cp -a "$H/etc/ludworks/config.json" /tmp/cfg.bak
          # manual unpack (dpkg --root chokes on the image statoverride)
          cd /tmp
          dpkg-deb -x /w/ludworks_0.1.1_amd64.deb "$H"
          # keep host config (:8444 binding) over packaged defaults
          if [ -f /tmp/cfg.bak ]; then
            cp /tmp/cfg.bak "$H/etc/ludworks/config.json"
          elif grep -q 8444 "$H/etc/ludworks/config.json"; then :; fi
          grep -q 8444 "$H/etc/ludworks/config.json" || { echo "no :8444 in config"; exit 1; }
          export DBUS_SESSION_BUS_ADDRESS=unix:path=/run/systemd/private
          SY="$H/usr/bin/systemctl"
          $SY daemon-reload
          $SY restart ludworks
          sleep 2
          $SY is-active ludworks
          curl -sk https://127.0.0.1:8444/api/v1/health
          echo
          EOF
          docker run --rm --network=host \
            -v "$SRC":/w -v /:/host -v /run:/run \
            -i ubuntu:24.04 sh /w/helper.sh

      - name: Verify from job network
        run: |
          set -euo pipefail
          V=""
          for i in $(seq 1 10); do
            V=$(curl -sk https://192.0.2.10:8444/api/v1/health || true)
            case "$V" in *0.1.1*) echo "OK: $V"; exit 0;; esac
            sleep 3
          done
          echo "still: $V"; exit 1
