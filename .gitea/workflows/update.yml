name: update-ludworks-server

# Installs the latest release (v0.1.1) .deb of ludworks on the deploy-01 host.
# The job container cannot nsenter (options ignored by the runner), so a
# helper container gets the job volume at /w plus the host root at /host.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ludworks-update
  cancel-in-progress: false

jobs:
  update:
    name: dpkg install 0.1.1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v3

      - name: Verify deb
        run: |
          set -euo pipefail
          test -f ludworks_0.1.1_amd64.deb
          echo "df1291884f85a1bee58fdc7e94bc61ff4adb878278d40cecd6f93b5a6d892f9a  ludworks_0.1.1_amd64.deb" | sha256sum -c -

      - name: Install on host via helper container
        run: |
          set -euo pipefail
          CID=$(hostname)
          SRC=$(docker inspect -f '{{range .Mounts}}{{.Source}} {{end}}' "$CID" \
                 | tr ' ' '\n' | grep '_data$' | head -1)
          echo "host volume: $SRC"
          test -n "$SRC"
          docker run --rm --network=host \
            -v "$SRC":/w -v /:/host -v /run:/run \
            -i ubuntu:24.04 sh -s <<'EOF'
          set -eu
          H=/host
          DEB=/w/ludworks_0.1.1_amd64.deb
          [ -f "$DEB" ] || DEB=/w/phastings/ludworks-server/ludworks_0.1.1_amd64.deb
          test -f "$DEB"
          [ -f "$H/etc/ludworks/config.json" ] && cp -a "$H/etc/ludworks/config.json" /tmp/cfg.bak
          export DEBIAN_FRONTEND=noninteractive
          dpkg --root="$H" -i "$DEB"
          if [ -f /tmp/cfg.bak ] && ! grep -q 8444 "$H/etc/ludworks/config.json"; then
            echo "restoring :8444 config"
            cp /tmp/cfg.bak "$H/etc/ludworks/config.json"
          fi
          systemctl daemon-reload
          systemctl restart ludworks
          sleep 2
          systemctl is-active ludworks
          curl -sk https://127.0.0.1:8444/api/v1/health
          echo
          EOF

      - name: Verify from job network
        run: |
          set -euo pipefail
          V=""
          for i in $(seq 1 10); do
            V=$(curl -sk https://192.168.68.68:8444/api/v1/health || true)
            case "$V" in *0.1.1*) echo "OK: $V"; exit 0;; esac
            sleep 3
          done
          echo "still: $V"; exit 1
