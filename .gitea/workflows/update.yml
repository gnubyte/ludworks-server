name: update-ludworks-server

# Installs the latest release (v0.1.1) .deb of ludworks on the deploy-01 host.
# A nested helper container (--pid=host) nsenters into host PID 1 (mount+unshare
# only; -i is not exposed) and does the install there.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ludworks-update
  cancel-in-progress: false

jobs:
  update:
    name: dpkg install 0.1.1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v3

      - name: Verify deb
        run: |
          set -euo pipefail
          test -f ludworks_0.1.1_amd64.deb
          echo "df1291884f85a1bee58fdc7e94bc61ff4adb878278d40cecd6f93b5a6d892f9a  ludworks_0.1.1_amd64.deb" | sha256sum -c -

      - name: Install on host via helper container (nsenter PID 1)
        run: |
          set -euo pipefail
          CID=$(hostname)
          SRC=$(docker inspect -f '{{range .Mounts}}{{if .Destination}}{{.Destination}}={{.Source}} {{end}}{{end}}' "$CID" | tr ' ' '\n' | grep 'ludworks-server=' | head -1 | cut -d= -f2)
          echo "host volume: $SRC"
          test -n "$SRC"
          cat > ./helper.sh <<'EOF'
          set -eu
          P=$(cat /proc/1/mountinfo | awk '{print $NF}' | grep -m1 'ludworks-server')
          nsenter -t 1 -m -u -- sh -s -- "$P" <<'EOT'
          set -eu
          P="$1"
          test -f "$P/ludworks_0.1.1_amd64.deb"
          [ -f /etc/ludworks/config.json ] && cp -a /etc/ludworks/config.json /tmp/cfg.bak
          dpkg-deb -x "$P/ludworks_0.1.1_amd64.deb" /
          if [ -f /tmp/cfg.bak ] && ! grep -q 8444 /etc/ludworks/config.json; then
            echo "restoring :8444 config"
            cp /tmp/cfg.bak /etc/ludworks/config.json
          fi
          systemctl restart ludworks || {
            echo "systemd restart failed; manual restart"
            kill "$(cat /run/ludworks.pid 2>/dev/null)" 2>/dev/null || true
            sleep 1
            (nohup /usr/bin/ludworks >/tmp/ludworks.log 2>&1 &)
          }
          sleep 2
          curl -sk https://127.0.0.1:8444/api/v1/health
          echo
          EOT
          EOF
          cp ./helper.sh ./helper_copy.sh
          docker run --rm --pid=host -v "$SRC":/w -i ubuntu:24.04 sh /w/helper_copy.sh

      - name: Verify from job network
        run: |
          set -euo pipefail
          V=""
          for i in $(seq 1 10); do
            V=$(curl -sk https://192.168.68.68:8444/api/v1/health || true)
            case "$V" in *0.1.1*) echo "OK: $V"; exit 0;; esac
            sleep 3
          done
          echo "still: $V"; exit 1
