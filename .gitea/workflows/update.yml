name: update-ludworks-server

# Installs the latest release (v0.1.1) .deb of ludworks on the deploy-01 host.
# A nested helper container (--pid=host) nsenters into host PID 1's mount ns
# and does the install there. Fallback: chroot into the host root via binds.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ludworks-update
  cancel-in-progress: false

jobs:
  update:
    name: dpkg install 0.1.1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify deb
        run: |
          set -euo pipefail
          test -f ludworks_0.1.1_amd64.deb
          echo "df1291884f85a1bee58fdc7e94bc61ff4adb878278d40cecd6f93b5a6d892f9a  ludworks_0.1.1_amd64.deb" | sha256sum -c -

      - name: Install on host via helper container
        run: |
          set -euo pipefail
          CID=$(hostname)
          SRC=$(docker inspect -f '{{range .Mounts}}{{if .Destination}}{{.Destination}}={{.Source}} {{end}}{{end}}' "$CID" | tr ' ' '\n' | grep 'ludworks-server=' | head -1 | cut -d= -f2)
          echo "host volume: $SRC"
          test -n "$SRC"
          cat > ./helper.sh <<'EOF'
          set -u
          P="$VOL"
          [ -f "$P/ludworks_0.1.1_amd64.deb" ] || P=/w
          echo "using deb dir: $P"
          if nsenter -t 1 -m -- true 2>/dev/null; then
            echo "nsenter -m works"
            nsenter -t 1 -m -- sh -s -- "$P" <<'EOT'
          set -x
          P="$1"
          if [ -f /etc/ludworks/config.json ]; then cp -a /etc/ludworks/config.json /tmp/cfg.bak; fi
          dpkg-deb -x "$P/ludworks_0.1.1_amd64.deb" /
          if [ -f /tmp/cfg.bak ] && ! grep -q 8444 /etc/ludworks/config.json; then
            echo "restoring :8444 config"; cp /tmp/cfg.bak /etc/ludworks/config.json
          fi
          systemctl restart ludworks
          sleep 2
          systemctl is-active ludworks
          curl -sk https://192.168.68.68:8444/api/v1/health
          echo
          EOT
          else
            echo "nsenter failed; using chroot fallback"
            if [ -f /host/etc/ludworks/config.json ]; then cp -a /host/etc/ludworks/config.json /tmp/cfg.bak; fi
            dpkg-deb -x "$P/ludworks_0.1.1_amd64.deb" /host
            if [ -f /tmp/cfg.bak ] && ! grep -q 8444 /host/etc/ludworks/config.json; then
              echo "restoring :8444 config"; cp /tmp/cfg.bak /host/etc/ludworks/config.json
            fi
            DBUS_SYSTEM_BUS_ADDRESS=unix:path=/run/systemd/private /host/usr/bin/systemctl restart ludworks
            sleep 2
            DBUS_SYSTEM_BUS_ADDRESS=unix:path=/run/systemd/private /host/usr/bin/systemctl is-active ludworks
            curl -sk https://192.168.68.68:8444/api/v1/health
            echo
          fi
          EOF
          cp ./helper.sh ./helper_copy.sh
          docker run --rm --pid=host --network=host -e VOL="$SRC" -v "$SRC":/w -v /:/host -v /run:/run \
            -i ubuntu:24.04 sh /w/helper_copy.sh

      - name: Verify from job network
        run: |
          set -euo pipefail
          V=""
          for i in $(seq 1 10); do
            V=$(curl -sk https://192.168.68.68:8444/api/v1/health || true)
            case "$V" in *0.1.1*) echo "OK: $V"; exit 0;; esac
            sleep 3
          done
          echo "still: $V"; exit 1
