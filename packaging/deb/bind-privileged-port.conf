# Example systemd drop-in: let Ludworks bind a privileged port (below 1024), such as
# "listen": ":443" or "redirect_listen": ":80" in /etc/ludworks/config.json.
#
# It grants only CAP_NET_BIND_SERVICE; every other sandbox setting of ludworks.service
# stays in force. Install it with:
#
#   sudo install -D -m 0644 /usr/share/doc/ludworks/examples/bind-privileged-port.conf \
#       /etc/systemd/system/ludworks.service.d/bind-privileged-port.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart ludworks
#
# A reverse proxy in front of Ludworks (see the configuration docs) is the alternative
# that needs no capability at all.

[Service]
AmbientCapabilities=CAP_NET_BIND_SERVICE
CapabilityBoundingSet=CAP_NET_BIND_SERVICE
