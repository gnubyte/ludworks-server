# Release pipeline: push a tag vX.Y.Z (matching the VERSION file) to build and publish
#
#   ludworks_<v>_amd64.deb, ludworks_<v>_arm64.deb, ludworks_<v>_windows_amd64.zip,
#   ludworks_<v>_windows_amd64_setup.exe (Inno Setup) and SHA256SUMS
#
# to the GitHub Release of that tag, with a signed SLSA build-provenance attestation for every
# file (Sigstore, tied to this workflow and the tag; users check it with
# `gh attestation verify`, see docs/getting-started/installation.md#downloads). SHA256SUMS
# alone only detects corrupted downloads: whoever can replace a file can replace it too.
#
# Actions are pinned to full commit SHAs (the comment names the tag); only the publish job
# can write to the repository or mint an OIDC token, and it never replaces an existing
# release. Repository settings this workflow relies on (they cannot be expressed here):
#
#   * environment "release": required reviewers (a maintainer approves every publish), and a
#     deployment rule that allows only tags matching v*;
#   * a tag ruleset for v*: only maintainers may create tags, and nobody may update
#     (move) or delete them;
#   * "Immutable releases" enabled, so published release assets cannot be swapped later.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly

jobs:
  packages:
    name: Test and build packages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache: false # release builds never restore a cache

      - name: Check the tag against VERSION
        id: version
        run: |
          version="$(tr -d ' \t\r\n' < VERSION)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match VERSION (${version})"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Vet and test
        run: |
          go mod verify
          go vet ./...
          go test -count=1 ./...

      - name: Build packages
        run: SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" bash scripts/package.sh

      - name: Rebuild and compare (packages must be reproducible)
        # A second build with an empty Go build cache must give byte-identical files, so that
        # anyone can check a release by rebuilding the tag and comparing with SHA256SUMS.
        run: |
          first="$RUNNER_TEMP/first-build"
          mkdir -p "$first"
          cp dist/SHA256SUMS dist/ludworks_* "$first/"
          GOCACHE="$RUNNER_TEMP/gocache-rebuild" SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            bash scripts/package.sh
          diff -u "$first/SHA256SUMS" dist/SHA256SUMS

      - name: Verify packages
        run: |
          set -x
          for deb in dist/*.deb; do
            dpkg-deb --info "$deb"
            dpkg-deb --contents "$deb"
          done
          python3 -I -m zipfile -l dist/*_windows_amd64.zip
          (cd dist && sha256sum -c SHA256SUMS)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: |
            dist/*.deb
            dist/*.zip
          if-no-files-found: error
          retention-days: 7

  installer:
    name: Windows installer (Inno Setup)
    needs: packages
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.packages.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: dist

      - name: Stage the zipped payload
        shell: pwsh
        run: |
          # The installer ships exactly the files of the released zip.
          Expand-Archive -LiteralPath "dist/ludworks_${env:VERSION}_windows_amd64.zip" -DestinationPath dist/stage/windows_amd64
          Get-ChildItem dist/stage/windows_amd64

      - name: Install Inno Setup 6.7.1 (pinned SHA-256 and publisher signature)
        # Straight from the upstream release (github.com/jrsoftware/issrc, tag is-6_7_1), not
        # from a third-party package feed. The SHA-256 is the digest GitHub lists for that
        # release asset; the Authenticode signer is the publisher named on jrsoftware.org.
        # Installed per user into RUNNER_TEMP, so a copy preinstalled on the image is never used.
        shell: pwsh
        env:
          INNO_URL: https://github.com/jrsoftware/issrc/releases/download/is-6_7_1/innosetup-6.7.1.exe
          INNO_SHA256: 4d11e8050b6185e0d49bd9e8cc661a7a59f44959a621d31d11033124c4e8a7b0
        run: |
          $dl = Join-Path $env:RUNNER_TEMP 'innosetup-download'
          New-Item -ItemType Directory -Force -Path $dl | Out-Null
          $file = Join-Path $dl 'innosetup-6.7.1.exe'
          Invoke-WebRequest -Uri $env:INNO_URL -OutFile $file -UseBasicParsing
          $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:INNO_SHA256) { throw "innosetup-6.7.1.exe has SHA-256 $hash, expected $env:INNO_SHA256" }
          $sig = Get-AuthenticodeSignature -LiteralPath $file
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Pyrsys B\.V\.') {
            throw "unexpected Authenticode signature on innosetup-6.7.1.exe: $($sig.Status) $($sig.SignerCertificate.Subject)"
          }
          $dir = Join-Path $env:RUNNER_TEMP 'InnoSetup6'
          $p = Start-Process -FilePath $file -Wait -PassThru -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES',
            '/NORESTART', '/SP-', '/CURRENTUSER', "/DIR=$dir", "/LOG=$env:RUNNER_TEMP\innosetup-install.log"
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\innosetup-install.log"; throw "Inno Setup installer exited with $($p.ExitCode)" }
          $iscc = Join-Path $dir 'ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) { throw "ISCC.exe not found in $dir" }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Compile the installer
        shell: pwsh
        run: |
          $numeric = ($env:VERSION -replace '[-+].*$', '') + '.0'
          & $env:ISCC /Q "/DAppVersion=$env:VERSION" "/DFileVersion=$numeric" `
            "/DPayloadDir=$PWD\dist\stage\windows_amd64" "/DOutputDir=$PWD\dist" packaging\windows\ludworks.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }

      - name: Smoke-test install, service and uninstall
        shell: pwsh
        run: |
          $setup = Resolve-Path "dist/ludworks_${env:VERSION}_windows_amd64_setup.exe"
          $installDir = "$env:ProgramFiles\Ludworks"
          $exe = "$installDir\ludworks.exe"

          # Any folder other than Program Files is refused (a folder at a drive root inherits
          # "Authenticated Users: Modify", so other users could replace the service binary).
          $p = Start-Process -FilePath $setup -Wait -PassThru `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/DIR=C:\Ludworks', "/LOG=$env:RUNNER_TEMP\setup-dir.log"
          if ($p.ExitCode -eq 0) { Get-Content "$env:RUNNER_TEMP\setup-dir.log"; throw 'setup accepted /DIR=C:\Ludworks' }
          if ((Test-Path 'C:\Ludworks\ludworks.exe') -or (Get-Service -Name Ludworks -ErrorAction SilentlyContinue)) {
            throw 'the refused setup installed files or the service anyway'
          }

          $p = Start-Process -FilePath $setup -Wait -PassThru `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS=firewall', "/LOG=$env:RUNNER_TEMP\setup.log"
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\setup.log"; throw "setup exited with $($p.ExitCode)" }
          $svc = Get-Service -Name Ludworks
          $svc.WaitForStatus('Running', [TimeSpan]::FromSeconds(60))
          $ok = $false
          for ($i = 0; $i -lt 100 -and -not $ok; $i++) {
            Start-Sleep -Milliseconds 300
            & curl.exe -fsk https://127.0.0.1:8443/api/v1/health
            $ok = $LASTEXITCODE -eq 0
          }
          if (-not $ok) { Get-Content "$env:ProgramData\Ludworks\ludworks.log" -ErrorAction SilentlyContinue; throw 'service health check failed' }
          if (-not (Test-Path "$env:ProgramData\Ludworks\setup-token.txt")) { throw 'setup token missing' }
          if ((Get-Item $exe).VersionInfo.ProductVersion -ne $env:VERSION) { throw 'installed exe has the wrong version resource' }

          # The service runs the binary in Program Files.
          $image = (Get-ItemProperty -LiteralPath 'HKLM:\SYSTEM\CurrentControlSet\Services\Ludworks').ImagePath
          if (-not $image.StartsWith("`"$exe`"", [StringComparison]::OrdinalIgnoreCase)) { throw "service ImagePath is $image" }

          # Neither the folder nor the programs in it (service binary, uninstaller) may be
          # writable, deletable or re-permissionable by Everyone, Authenticated Users, Users,
          # Interactive or Guests.
          $weak = 'S-1-1-0', 'S-1-5-11', 'S-1-5-32-545', 'S-1-5-4', 'S-1-5-32-546'
          # WriteData|AppendData|WriteEA|DeleteChild|WriteAttributes|Delete|WRITE_DAC|WRITE_OWNER|GENERIC_ALL|GENERIC_WRITE
          $writeMask = 0x500D0156
          foreach ($item in $installDir, $exe, "$installDir\unins000.exe", "$installDir\unins000.dat") {
            $rules = (Get-Acl -LiteralPath $item).GetAccessRules($true, $true, [Security.Principal.SecurityIdentifier])
            foreach ($ace in $rules) {
              if ($ace.AccessControlType -ne 'Allow') { continue }
              if ($ace.PropagationFlags -band [Security.AccessControl.PropagationFlags]::InheritOnly) { continue }
              if (($weak -contains $ace.IdentityReference.Value) -and ([int]$ace.FileSystemRights -band $writeMask)) {
                throw "$item grants $($ace.IdentityReference) $($ace.FileSystemRights)"
              }
            }
          }

          # The firewall rule admits only the local subnet.
          $rule = Get-NetFirewallRule -DisplayName 'Ludworks (HTTPS 8443)' -ErrorAction SilentlyContinue
          if (-not $rule) { throw 'firewall rule missing' }
          $remote = @(($rule | Get-NetFirewallAddressFilter).RemoteAddress)
          if ($remote.Count -ne 1 -or $remote[0] -ne 'LocalSubnet') { throw "firewall rule remote addresses: $remote" }

          $u = Start-Process -FilePath "$installDir\unins000.exe" -Wait -PassThru `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          if ($u.ExitCode -ne 0) { throw "uninstall exited with $($u.ExitCode)" }
          for ($i = 0; $i -lt 60 -and (Get-Service -Name Ludworks -ErrorAction SilentlyContinue); $i++) { Start-Sleep -Milliseconds 500 }
          if (Get-Service -Name Ludworks -ErrorAction SilentlyContinue) { throw 'service still registered after uninstall' }
          if (Get-NetFirewallRule -DisplayName 'Ludworks (HTTPS 8443)' -ErrorAction SilentlyContinue) { throw 'firewall rule left behind' }
          if (-not (Test-Path "$env:ProgramData\Ludworks\ludworks.db")) { throw 'uninstall removed the data directory' }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer
          path: dist/*_setup.exe
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the GitHub release
    needs: [packages, installer]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Waits for a maintainer's approval (required reviewers on the "release" environment).
    environment: release
    permissions:
      contents: write # create the release
      id-token: write # OIDC token for the Sigstore signing certificate of the attestation
      attestations: write # store the attestation
    env:
      VERSION: ${{ needs.packages.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Never replace an existing release
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::A release for $TAG already exists. Published files are never replaced: find out why it exists, then delete it by hand, or release a new version."
            exit 1
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum ludworks_* > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/ludworks_*
            dist/SHA256SUMS

      - name: Create the release
        run: |
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          cat > notes.md <<EOF
          ## Downloads

          | File | For |
          |---|---|
          | \`ludworks_${VERSION}_amd64.deb\` / \`ludworks_${VERSION}_arm64.deb\` | Debian 12+ / Ubuntu 22.04+: \`sudo apt install ./ludworks_${VERSION}_amd64.deb\` |
          | \`ludworks_${VERSION}_windows_amd64_setup.exe\` | Windows 10/11 / Server 2019+ installer (service, optional firewall rule) |
          | \`ludworks_${VERSION}_windows_amd64.zip\` | Windows without installer: \`ludworks.exe\` + \`install-service.ps1\` |
          | \`SHA256SUMS\` | SHA-256 checksums (detect damaged downloads; not a signature) |

          **Verify before installing.** Every file has a signed build-provenance attestation. With the
          [GitHub CLI](https://cli.github.com/):

          \`\`\`
          gh attestation verify <file> --repo ${GITHUB_REPOSITORY} --signer-workflow ${GITHUB_REPOSITORY}/.github/workflows/release.yml --source-ref refs/tags/${TAG}
          \`\`\`

          After installing, read the one-time setup token (\`sudo cat /var/lib/ludworks/setup-token.txt\`, or
          \`C:\\ProgramData\\Ludworks\\setup-token.txt\` from an elevated prompt) and open https://<server>:8443/.
          Documentation: https://ludworks.readthedocs.io
          EOF
          # A release is created exactly once; assets of an existing release are never replaced.
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Ludworks ${VERSION}" --notes-file notes.md --generate-notes "${prerelease[@]}"
